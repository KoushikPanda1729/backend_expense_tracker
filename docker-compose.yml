# One-server deployment: Postgres + migrations + the API, with files kept on a volume.
#   cp .env.production.example .env.production   (fill it in)
#   docker compose --env-file .env.production up -d --build
# Put an HTTPS reverse proxy (Caddy, nginx, a cloud load balancer) in front of port 4000.
services:
  # Only used when you do NOT set DATABASE_URL (a Postgres inside this compose file).
  # Start it with:  docker compose --profile local-db ...   With a hosted database (Supabase, RDS) it stays off.
  db:
    image: postgres:16
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: kharcha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unused}
      POSTGRES_DB: kharcha_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharcha -d kharcha_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  # runs once, creates/updates the tables, then exits
  migrate:
    build: .
    command: ["npx", "node-pg-migrate", "up", "-m", "migrations"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://kharcha:${POSTGRES_PASSWORD:-unused}@db:5432/kharcha_db}
    depends_on:
      db:
        condition: service_healthy
        required: false

  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://kharcha:${POSTGRES_PASSWORD:-unused}@db:5432/kharcha_db}
      STORAGE_DIR: /app/storage # only used when STORAGE_DRIVER=local
    ports:
      - "127.0.0.1:4000:4000" # only Caddy (below) and the server itself reach the API
    volumes:
      - storage:/app/storage # only needed with STORAGE_DRIVER=local; with s3 you can delete this volume
    depends_on:
      migrate:
        condition: service_completed_successfully

  # HTTPS in front of the API. With no domain use <ip-with-dashes>.sslip.io (it resolves to that IP);
  # Caddy gets a real certificate for it by itself. Ports 80 and 443 must be open in the security group.
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env.production} --to api:4000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
